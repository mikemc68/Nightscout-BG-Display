<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="14" fill="#f6f7f9"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">What you need</text>

  <!-- 1 board -->
  <g transform="translate(40,60)">
    <rect width="300" height="200" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="40" y="18" width="220" height="140" rx="8" fill="#222226"/>
    <rect x="50" y="28" width="200" height="120" fill="#000"/>
    <text x="150" y="104" text-anchor="middle" font-size="52" font-weight="700" fill="#5DCAA5">6.4</text>
    <circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="150" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">3.5" ESP32-S3 display, 320×480</text>
    <text x="150" y="194" text-anchor="middle" font-size="12" fill="#6b7280">Guition JC3248W535 / JC4832W535</text>
  </g>

  <!-- 2 cable -->
  <g transform="translate(370,60)">
    <rect width="250" height="200" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <path d="M40,90 C90,40 160,140 210,90" stroke="#374151" stroke-width="7" fill="none"/>
    <rect x="18" y="80" width="28" height="20" rx="4" fill="#6b7280"/>
    <rect x="204" y="80" width="28" height="20" rx="4" fill="#6b7280"/>
    <circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="125" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">USB-C data cable</text>
    <text x="125" y="178" text-anchor="middle" font-size="12" fill="#6b7280">must carry data, not just power</text>
    <text x="125" y="194" text-anchor="middle" font-size="12" fill="#6b7280">+ a USB phone charger later</text>
  </g>

  <!-- 3 speaker -->
  <g transform="translate(650,60)">
    <rect width="270" height="200" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="70" y="40" width="70" height="70" rx="10" fill="#374151"/>
    <circle cx="105" cy="75" r="24" fill="#4b5563"/><circle cx="105" cy="75" r="9" fill="#1f2937"/>
    <path d="M140,62 C170,62 175,48 200,48" stroke="#dc2626" stroke-width="3" fill="none"/>
    <path d="M140,70 C170,70 175,56 200,56" stroke="#111827" stroke-width="3" fill="none"/>
    <rect x="198" y="42" width="20" height="20" rx="2" fill="#f5f5f4" stroke="#78716c"/>
    <circle cx="20" cy="20" r="11" fill="#9ca3af"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="135" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Small speaker (optional)</text>
    <text x="135" y="166" text-anchor="middle" font-size="12" fill="#6b7280">8 Ω, 1–3 W, JST 1.25 mm 2-pin plug</text>
    <text x="135" y="182" text-anchor="middle" font-size="12" fill="#6b7280">only needed for the low alarm</text>
  </g>
</svg>
